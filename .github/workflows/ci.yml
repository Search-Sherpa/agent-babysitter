name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.9 is the oldest supported version. The setup action has no 3.9 build
          # for the newest Ubuntu image, so this cell stays on an older one.
          - os: ubuntu-24.04
            python: "3.9"
          # macos-latest is ARM64. The newest 3.9 with an ARM64 build there is an
          # old patch release; it is kept because 3.9 is the oldest supported version.
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show tool versions
        shell: bash
        run: |
          python --version
          git --version
          bash --version | head -1
          ssh -V
      - name: Run the tests
        run: python -m unittest discover -s tests -t .
      - name: Install the package and check what was installed
        shell: bash
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          babysitter --help
          python - <<'EOF'
          from pathlib import Path
          import agent_babysitter
          package = Path(agent_babysitter.__file__).resolve().parent
          assert "site-packages" in package.parts, f"imported from the checkout: {package}"
          wanted = {"_runner.sh", "ask-claude.sh", "ask-codex.sh", "ask-gemini.sh", "ask-grok.sh"}
          found = {path.name for path in (package / "advisors").glob("*.sh")}
          assert found == wanted, f"advisor wrappers installed: {sorted(found)}"
          print("installed at", package, "with", len(found), "wrappers")
          EOF
