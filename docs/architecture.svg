<text x="848" y="780" class="mono" font-size="12" font-weight="800" fill="#38BDF8">5. SIGNATURE BINDINGS &amp; HONEST LIMITS</text>
<text x="848" y="808" class="mono" font-size="11.8" font-weight="700" fill="#F8FAFC">Commit:</text>
<text x="976" y="808" class="sans" font-size="12.2" fill="#CBD5E1">repo + staged tree + parent(s) + merge heads</text>
<text x="848" y="832" class="mono" font-size="11.8" font-weight="700" fill="#F8FAFC">Push / Rebase:</text>
<text x="976" y="832" class="sans" font-size="12.2" fill="#CBD5E1">repo + remote + ref updates  |  upstream/branch commits + HEAD</text>
<text x="848" y="856" class="mono" font-size="11.8" font-weight="700" fill="#F8FAFC">Protected Edit:</text>
<text x="976" y="856" class="sans" font-size="12.2" fill="#CBD5E1">tool + path + full edit SHA-256 (printed on terminal prompt)</text>
<text x="848" y="880" class="mono" font-size="11.8" font-weight="700" fill="#F8FAFC">Other Command:</text>
<text x="976" y="880" class="sans" font-size="12.2" fill="#CBD5E1">exact command text + working directory within TTL</text>
<line x1="848" y1="898" x2="1534" y2="898" stroke="#334155" stroke-width="1"/>
<text x="848" y="922" class="sans" font-size="12.2" font-weight="600" fill="#FDE68A">Alpha limits: runs with your user permissions; script/Makefile indirection can evade rules;</text>
<text x="848" y="942" class="sans" font-size="12.2" fill="#94A3B8">reading files (including unencrypted keys) is not gated; lane 2 is advice, not a gate.</text>
<text x="848" y="962" class="mono" font-size="11.2" fill="#38BDF8">169 tests / 10 CI cells green (a352d68) | passphrase approve checked on Win11 PS + OpenSSH 9.5 (0.1.0 only)</text>
